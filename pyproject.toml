[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-cost-optimizer"
version = "0.1.0"
description = "Local, approval-gated cost-aware model router for OpenAI Codex"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.8",
  "typer>=0.12",
]

[project.optional-dependencies]
codex = ["openai-codex>=0.1"]
dev = ["pytest>=8"]

[project.scripts]
cco = "codex_cost_optimizer.cli:app"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
